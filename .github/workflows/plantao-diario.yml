name: 🤖 Plantão Diário Automático

on:
  schedule:
    # Roda todos os dias às 23:00 UTC (20:00 Horário de Brasília)
    - cron: '0 23 * * *'
  workflow_dispatch: # Permite disparar manualmente com 1 clique no GitHub Actions

permissions:
  contents: write

jobs:
  plantao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clonar base léxica pt-br se necessário
        run: |
          if [ ! -d "dados/brutos/pt-br" ]; then
            git clone --depth 1 https://github.com/fserb/pt-br dados/brutos/pt-br
          fi

      - name: Executar Plantão Diário
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 scripts/plantao_automatico.py

      - name: Obter data de hoje
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Tudo automático, sem PR: o resultado entra direto no main. As travas estão no próprio
      # plantão: só apelidos de erros de digitação óbvios e respostas que a IA aprovou, que 2 ou
      # mais pessoas deram e que não caem em dados/bloqueadas.js. O relatório do dia fica no
      # resumo desta execução (aba Actions) e no histórico do commit.
      - name: Gravar no main
        id: gravar
        run: |
          cat PLANTAO_RESUMO.md >> "$GITHUB_STEP_SUMMARY"
          rm -f PLANTAO_RESUMO.md
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou hoje."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "plantao-nicho[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(plantao): revisao diaria e recusadas de ${{ steps.date.outputs.date }}"
          git pull --rebase -q origin main
          git push origin HEAD:main
          echo "mudou=sim" >> "$GITHUB_OUTPUT"

      # Um push feito pela própria action não dispara a carga-banco.yml (regra do GitHub),
      # então a carga do D1 roda aqui mesmo. (O site no Cloudflare Pages atualiza sozinho com o push.)
      - name: Configurar Node 22
        if: steps.gravar.outputs.mudou == 'sim'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Carregar o banco (Cloudflare D1)
        if: steps.gravar.outputs.mudou == 'sim'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute nicho --remote --file=banco/schema.sql --yes
          npx --yes wrangler@4 d1 execute nicho --remote --file=banco/carga_dias.sql --yes
