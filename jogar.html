<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nicho</title>
  <meta name="description" content="Jogo diário de palavras: quanto mais nichada a resposta, mais longe seu foguete vai.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
:root {
  --fundo: #07031f;
  --caixa: #140c45;
  --borda: #3ad7ff;
  --texto: #f4f4ff;
  --suave: #9aa3c7;
  --amarelo: #ffd23f;
  --rosa: #ff3dd6;
  --verde: #7ef0c1;
  --vermelho: #ff3d6e;
  --titulo: "Press Start 2P", monospace;
  --corpo: "VT323", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background-color: var(--fundo);
  /* estrelinhas de 2px repetidas no fundo */
  background-image:
    radial-gradient(#ffffff 1px, transparent 1px),
    radial-gradient(#8f86ff 1px, transparent 1px);
  background-size: 97px 89px, 53px 61px;
  background-position: 0 0, 23px 31px;
  color: var(--texto);
  font-family: var(--corpo);
  font-size: 22px;
  line-height: 1.25;
}
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
header { text-align: center; margin-bottom: 16px; }
h1 {
  font-family: var(--titulo);
  font-size: 40px;
  margin: 0;
  color: var(--amarelo);
  text-shadow: 4px 4px 0 var(--rosa), 8px 8px 0 #3a1a8a;
  letter-spacing: 4px;
}
.lema { color: var(--suave); margin: 12px 0 0; }

#cena {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  margin-bottom: 16px;
  box-shadow: 0 0 0 4px var(--fundo), 0 0 0 8px var(--borda);
}

/* Borda "em degraus" de pixel art */
.caixa {
  background: var(--caixa);
  padding: 20px;
  margin: 8px;
  box-shadow:
    0 -4px 0 0 var(--borda), 0 4px 0 0 var(--borda),
    -4px 0 0 0 var(--borda), 4px 0 0 0 var(--borda),
    8px 8px 0 0 #000;
}
.progresso { display: flex; justify-content: space-between; color: var(--suave); }
#distancia { color: var(--amarelo); }
h2 { font-family: var(--titulo); font-size: 15px; line-height: 1.7; margin: 16px 0; }
form { display: flex; gap: 12px; }
input {
  flex: 1; min-width: 0;
  padding: 10px 12px;
  font: inherit;
  background: #07031f; color: var(--texto);
  border: 0; border-radius: 0;
  box-shadow: inset 0 0 0 3px #5b4bd6;
}
input:focus { outline: none; box-shadow: inset 0 0 0 3px var(--amarelo); }
button {
  font-family: var(--titulo); font-size: 12px;
  padding: 12px 14px;
  border: 0; border-radius: 0;
  background: var(--amarelo); color: #1a1000;
  box-shadow: inset -4px -4px 0 #c79400, 4px 4px 0 #000;
  cursor: pointer;
}
button:active { transform: translate(2px, 2px); box-shadow: inset -4px -4px 0 #c79400, 2px 2px 0 #000; }
button:disabled { filter: grayscale(1); opacity: 0.5; cursor: default; }
#combustivel { color: var(--suave); min-height: 1.2em; }
#mensagem { min-height: 1.4em; }
.acerto { color: var(--verde); }
.erro { color: var(--vermelho); }
.supernova { color: var(--rosa); animation: piscar 0.4s steps(2) 6; }
@keyframes piscar { 50% { color: var(--amarelo); } }
ol { padding-left: 1.4em; margin: 8px 0 16px; }
li span, .suave { color: var(--suave); }
pre {
  font-family: var(--corpo); font-size: 24px;
  white-space: pre-wrap; background: #07031f; padding: 12px;
  box-shadow: inset 0 0 0 3px #5b4bd6;
}
#carregando { text-align: center; color: var(--suave); }

@media (max-width: 420px) {
  h1 { font-size: 30px; }
  form { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  .supernova { animation: none; }
}
</style>
</head>
<body>
  <main>
    <header>
      <h1>NICHO</h1>
      <p class="lema">uma em um bilhão de estrelas</p>
    </header>

    <canvas id="cena" aria-hidden="true"></canvas>

    <section id="painel" class="caixa" hidden>
      <div class="progresso">
        <span id="rodada"></span>
        <span id="distancia">0 anos-luz</span>
      </div>
      <h2 id="pergunta"></h2>
      <form id="formulario" autocomplete="off">
        <input id="palpite" type="text" placeholder="sua resposta…" aria-label="Sua resposta" required>
        <button type="submit">LANÇAR</button>
      </form>
      <p id="combustivel"></p>
      <p id="mensagem" role="status"></p>
      <div id="revelacao" hidden>
        <p>As mais nichadas desta pergunta:</p>
        <ol id="top"></ol>
        <button id="proxima" type="button">PRÓXIMA ▶</button>
      </div>
    </section>

    <section id="fim" class="caixa" hidden>
      <h2>FIM DA VIAGEM</h2>
      <p id="resumo"></p>
      <pre id="compartilhar"></pre>
      <button id="copiar" type="button">COPIAR RESULTADO</button>
      <p class="suave">Novas perguntas amanhã.</p>
    </section>

    <p id="carregando">contagem regressiva…</p>
  </main>

  <script>
// Cena em pixel art: foguete subindo por um campo de estrelas.
// Tudo é desenhado numa tela pequena (96x54) e ampliado sem suavização,
// então cada "pixel" do sprite vira um bloco nítido na tela.

const LARGURA = 96;
const ALTURA = 54;

const CORES = {
  W: "#f4f4ff", // casco
  G: "#9aa3c7", // sombra do casco
  R: "#ff3d6e", // aletas e bico
  B: "#3ad7ff", // janela
  F: "#ffd23f", // chama clara
  f: "#ff7b00", // chama escura
  P: "#b06bff", // planeta
  p: "#7a3cff", // faixa do planeta
  O: "#ffd23f", // anel
  L: "#c9cede", // lua
  l: "#8a90a8", // cratera
  S: "#ffffff", // estrela
  s: "#ffd23f", // brilho
  M: "#ff3dd6", // supernova
  C: "#3ad7ff", // satélite
};

// Sprites: cada string é uma linha, "." é transparente.
const SPRITES = {
  foguete: [
    ".....R.....",
    "....RRR....",
    "....WWW....",
    "...WWWWG...",
    "...WWBWG...",
    "...WBBBG...",
    "...WWBWG...",
    "...WWWWG...",
    "...WWWWG...",
    "..RWWWWGR..",
    ".RRWWWWGRR.",
    ".RR.GGG.RR.",
  ],
  chama: [
    ["....FFF....", ".....f.....", "..........."],
    ["....FfF....", "....fFf....", ".....f....."],
  ],
  satelite: [
    "CC.....CC",
    "CC..W..CC",
    "CCWWWWWCC",
    "CC..W..CC",
    "CC.....CC",
  ],
  lua: [
    "..LLLL..",
    ".LLlLLL.",
    "LLLLLlLL",
    "LlLLLLLL",
    "LLLLlLLL",
    "LLlLLLLL",
    ".LLLLlL.",
    "..LLLL..",
  ],
  planeta: [
    "....PPPPP....",
    "..PPPPPPPPP..",
    ".PPpppppPPPP.",
    "OOOOOOOOOOOOO",
    "PPPPPPPPPpppP",
    ".PpppPPPPPPP.",
    "..PPPPPPPPP..",
    "....PPPPP....",
  ],
  supernova: [
    "......s......",
    "...s..M..s...",
    "....MMMMM....",
    "...MMSSSMM...",
    "..MMSSSSSMM..",
    "s.MSSSSSSSM.s",
    "..MMSSSSSMM..",
    "...MMSSSMM...",
    "....MMMMM....",
    "...s..M..s...",
    "......s......",
  ],
};

function desenharSprite(ctx, linhas, x, y) {
  for (let j = 0; j < linhas.length; j++) {
    for (let i = 0; i < linhas[j].length; i++) {
      const cor = CORES[linhas[j][i]];
      if (!cor) continue;
      ctx.fillStyle = cor;
      ctx.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
    }
  }
}

// Fonte de 3x5 pixels só com dígitos e "+", para os números da cena.
const DIGITOS = {
  0: ["111", "101", "101", "101", "111"],
  1: ["010", "110", "010", "010", "111"],
  2: ["111", "001", "111", "100", "111"],
  3: ["111", "001", "111", "001", "111"],
  4: ["101", "101", "111", "001", "001"],
  5: ["111", "100", "111", "001", "111"],
  6: ["111", "100", "111", "101", "111"],
  7: ["111", "001", "010", "010", "010"],
  8: ["111", "101", "111", "101", "111"],
  9: ["111", "101", "111", "001", "111"],
  "+": ["000", "010", "111", "010", "000"],
};

function desenharTexto(ctx, texto, x, y, cor) {
  ctx.fillStyle = cor;
  [...texto].forEach((c, n) => {
    const d = DIGITOS[c];
    if (!d) return;
    d.forEach((linha, j) =>
      [...linha].forEach((v, i) => v === "1" && ctx.fillRect(x + n * 4 + i, y + j, 1, 1))
    );
  });
}

function criarCena(canvas) {
  canvas.width = LARGURA;
  canvas.height = ALTURA;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const reduzirMovimento = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const estrelas = Array.from({ length: 45 }, () => ({
    x: Math.floor(Math.random() * LARGURA),
    y: Math.random() * ALTURA,
    camada: 1 + Math.floor(Math.random() * 3),
  }));
  let velocidade = 0.15;
  let alvo = 0.15;
  let visitante = null; // sprite que passa ao lado do foguete após uma resposta
  let quadro = 0;

  function passo() {
    quadro++;
    velocidade += (alvo - velocidade) * 0.05;
    alvo += (0.15 - alvo) * 0.01;

    ctx.fillStyle = "#0b0630";
    ctx.fillRect(0, 0, LARGURA, ALTURA);

    for (const e of estrelas) {
      e.y += velocidade * e.camada;
      if (e.y >= ALTURA) {
        e.y -= ALTURA;
        e.x = Math.floor(Math.random() * LARGURA);
      }
      ctx.fillStyle = e.camada === 3 ? "#ffffff" : e.camada === 2 ? "#8f86ff" : "#4a3f9e";
      ctx.fillRect(e.x, Math.floor(e.y), 1, 1);
      if (velocidade > 1 && e.camada === 3) ctx.fillRect(e.x, Math.floor(e.y) - 2, 1, 2);
    }

    if (visitante) {
      visitante.y += velocidade * 2;
      desenharSprite(ctx, SPRITES[visitante.tipo], visitante.x, visitante.y);
      desenharTexto(ctx, visitante.texto, visitante.x, visitante.y - 8, visitante.cor);
      if (visitante.y > ALTURA + 10) visitante = null;
    }

    const balanco = reduzirMovimento ? 0 : Math.round(Math.sin(quadro / 20));
    const fx = 42;
    const fy = 34 + balanco;
    desenharSprite(ctx, SPRITES.foguete, fx, fy);
    desenharSprite(ctx, SPRITES.chama[Math.floor(quadro / 6) % 2], fx, fy + 12);

    requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);

  return {
    // Mostra o sprite da faixa de pontos e acelera o foguete.
    comemorar(pontos, supernova) {
      const tipo = faixa(pontos, supernova);
      const cor = supernova ? "#ff3dd6" : pontos >= 50 ? "#ffd23f" : "#7ef0c1";
      visitante = { tipo, x: 70, y: -14, texto: "+" + pontos, cor };
      alvo = reduzirMovimento ? 0.3 : Math.min(3, 0.4 + pontos / 40);
    },
  };
}

function faixa(pontos, supernova) {
  if (supernova) return "supernova";
  if (pontos >= 50) return "planeta";
  if (pontos >= 15) return "lua";
  return "satelite";
}
</script>

// Nicho: protótipo do jogo diário.
// Cada rodada mostra uma pergunta-tema; o jogador dá UMA resposta válida.
// Quanto mais nichada a resposta, mais anos-luz ela vale.
// Acertar a "supernova" (a resposta secreta da pergunta) dobra os pontos.
// criarCena e faixa vêm de cena.js; as perguntas vêm de dados.js (window.NICHO_DADOS).

const RODADAS_POR_DIA = 7;
const TENTATIVAS = 3;
const ICONES = { satelite: "🛰️", lua: "🌙", planeta: "🪐", supernova: "🌟", nada: "⚫" };

// Mesma regra de scripts/pontuar.py: minúsculas, sem acento, hífen vira espaço.
function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

// Sorteio determinístico pela data: todo mundo recebe as mesmas perguntas no dia.
function geradorDoDia(data) {
  let semente = Number(data.replaceAll("-", ""));
  return () => {
    semente = (semente * 1103515245 + 12345) % 2147483648;
    return semente / 2147483648;
  };
}

function embaralhar(lista, sortear) {
  const copia = [...lista];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(sortear() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function hojeLocal() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// Progresso do dia fica no navegador, para não perder ao recarregar.
// Se o armazenamento estiver bloqueado, o jogo funciona igual, só não lembra.
const CHAVE = () => `nicho:${estado.data}`;
function salvarProgresso() {
  try {
    localStorage.setItem(CHAVE(), JSON.stringify({ historico: estado.historico, total: estado.total }));
  } catch {}
}
function lerProgresso() {
  try {
    return JSON.parse(localStorage.getItem(CHAVE()) || "null");
  } catch {
    return null;
  }
}

const $ = (id) => document.getElementById(id);
const cena = criarCena($("cena"));

const estado = {
  data: hojeLocal(),
  categorias: [],
  rodada: 0,
  tentativas: TENTATIVAS,
  total: 0,
  historico: [], // { categoria, resposta, pontos, supernova }
};

function iniciar() {
  const dados = window.NICHO_DADOS;
  if (!dados) {
    $("carregando").textContent = "Não achei as perguntas (jogo/dados.js). Rode python3 scripts/pontuar.py.";
    return;
  }
  const escolhidas = embaralhar(dados.indice, geradorDoDia(estado.data)).slice(0, RODADAS_POR_DIA);
  estado.categorias = escolhidas.map((c) => prepararCategoria(dados.categorias[c.id]));
  $("carregando").hidden = true;

  const salvo = lerProgresso();
  if (salvo) {
    estado.historico = salvo.historico;
    estado.total = salvo.total;
    estado.rodada = salvo.historico.length;
  }
  if (estado.rodada >= estado.categorias.length) {
    mostrarFim();
    return;
  }
  $("painel").hidden = false;
  mostrarRodada();
}

function prepararCategoria(cat) {
  const mapa = new Map();
  for (const r of cat.respostas) {
    for (const nome of [r.resposta, ...r.apelidos]) mapa.set(normalizar(nome), r);
  }
  return { ...cat, mapa };
}

function mostrarRodada() {
  const cat = estado.categorias[estado.rodada];
  estado.tentativas = TENTATIVAS;
  $("rodada").textContent = `pergunta ${estado.rodada + 1}/${estado.categorias.length}`;
  $("pergunta").textContent = cat.pergunta || cat.titulo;
  avisar("", "");
  $("revelacao").hidden = true;
  $("palpite").value = "";
  $("palpite").disabled = false;
  $("formulario").querySelector("button").disabled = false;
  atualizarPainel();
  $("palpite").focus();
}

function atualizarPainel() {
  $("combustivel").textContent =
    "combustível " + "■".repeat(estado.tentativas) + "□".repeat(TENTATIVAS - estado.tentativas);
  $("distancia").textContent = `${estado.total} anos-luz`;
}

function palpitar(evento) {
  evento.preventDefault();
  const cat = estado.categorias[estado.rodada];
  const texto = $("palpite").value.trim();
  if (!texto) return;
  const achada = cat.mapa.get(normalizar(texto));

  if (!achada) {
    estado.tentativas -= 1;
    atualizarPainel();
    $("palpite").value = "";
    if (estado.tentativas > 0) {
      avisar(`"${texto}" não está no mapa estelar. Tente de novo.`, "erro");
      return;
    }
    avisar("Acabou o combustível nesta pergunta. 0 anos-luz.", "erro");
    encerrarRodada(null, 0, false);
    return;
  }

  const supernova = achada.resposta === cat.supernova;
  const pontos = supernova ? achada.pontos * 2 : achada.pontos;
  if (supernova) {
    avisar(`SUPERNOVA! ${achada.resposta} vale ${pontos} anos-luz.`, "supernova");
  } else {
    avisar(`${achada.resposta}: +${pontos} anos-luz.`, "acerto");
  }
  cena.comemorar(pontos, supernova);
  encerrarRodada(achada.resposta, pontos, supernova);
}

function encerrarRodada(resposta, pontos, supernova) {
  const cat = estado.categorias[estado.rodada];
  estado.total += pontos;
  estado.historico.push({ categoria: cat.titulo, resposta, pontos, supernova });
  salvarProgresso();
  atualizarPainel();
  $("palpite").disabled = true;
  $("formulario").querySelector("button").disabled = true;

  const top = [...cat.respostas].sort((a, b) => b.pontos - a.pontos).slice(0, 5);
  if (!top.some((r) => r.resposta === cat.supernova)) {
    top.push(cat.respostas.find((r) => r.resposta === cat.supernova));
  }
  $("top").innerHTML = "";
  for (const r of top) {
    const li = document.createElement("li");
    li.textContent = r.resposta + " ";
    const extra = document.createElement("span");
    extra.textContent = `${r.pontos} anos-luz${r.resposta === cat.supernova ? " · supernova" : ""}`;
    li.append(extra);
    $("top").append(li);
  }
  $("proxima").textContent = estado.rodada + 1 < estado.categorias.length ? "PRÓXIMA ▶" : "VER RESULTADO";
  $("revelacao").hidden = false;
  $("proxima").focus();
}

function avisar(texto, classe) {
  $("mensagem").textContent = texto;
  $("mensagem").className = classe;
}

function proxima() {
  estado.rodada += 1;
  if (estado.rodada < estado.categorias.length) {
    mostrarRodada();
    return;
  }
  mostrarFim();
}

function mostrarFim() {
  $("painel").hidden = true;
  $("fim").hidden = false;
  $("resumo").textContent = `Você viajou ${estado.total} anos-luz hoje.`;
  const icones = estado.historico.map((h) => (h.resposta === null ? ICONES.nada : ICONES[faixa(h.pontos, h.supernova)]));
  $("compartilhar").textContent = `NICHO ${estado.data}\n${icones.join("")}\n${estado.total} anos-luz 🚀`;
}

function copiar() {
  const texto = $("compartilhar").textContent;
  const selecionar = () => {
    // sem acesso à área de transferência: seleciona o texto para copiar à mão
    const faixaTexto = document.createRange();
    faixaTexto.selectNodeContents($("compartilhar"));
    getSelection().removeAllRanges();
    getSelection().addRange(faixaTexto);
    $("copiar").textContent = "SELECIONADO, É SÓ COPIAR";
  };
  try {
    navigator.clipboard.writeText(texto).then(() => ($("copiar").textContent = "COPIADO!"), selecionar);
  } catch {
    selecionar();
  }
}

$("formulario").addEventListener("submit", palpitar);
$("proxima").addEventListener("click", proxima);
$("copiar").addEventListener("click", copiar);
iniciar();
</script>
</body>
</html>
