<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nicho</title>
  <meta name="description" content="Jogo diário de palavras: quanto mais nichada a resposta, mais fundo seu foguete desce no espaço.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
:root {
  color-scheme: dark;
  --fundo: #07031f;
  --caixa: rgba(14, 8, 52, 0.88);
  --borda: #3ad7ff;
  --texto: #f4f4ff;
  --suave: #b8bfe0;
  --amarelo: #ffd23f;
  --rosa: #ff3dd6;
  --roxo: #b06bff;
  --verde: #7ef0c1;
  --vermelho: #ff3d6e;
  --titulo: "Press Start 2P", monospace;
  --corpo: "VT323", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fundo); }
body { color: var(--texto); font-family: var(--corpo); font-size: 22px; line-height: 1.2; }

/* Tudo dentro de #tela, para o tremor sacudir a tela inteira */
#tela { position: fixed; inset: 0; }
#cena {
  position: absolute; inset: 0; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
}

#hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; gap: 16px;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  font-family: var(--titulo); font-size: 12px; text-shadow: 2px 2px 0 #000;
  pointer-events: none;
}
#hud div { display: flex; flex-direction: column; gap: 6px; }
#hud .direita { align-items: flex-end; }
#hud .rotulo { color: var(--suave); font-size: 9px; }
#distancia { color: var(--amarelo); font-size: 20px; font-variant-numeric: tabular-nums; }

.sobreposto {
  position: absolute; left: 0; right: 0; bottom: 12%;
  text-align: center; padding: 0 16px;
}
h1 {
  font-family: var(--titulo); font-size: clamp(36px, 9vw, 72px); margin: 0 0 16px;
  color: var(--amarelo); letter-spacing: 6px;
  text-shadow: 4px 4px 0 var(--rosa), 8px 8px 0 #1a0a4a;
}
#inicio p { text-shadow: 2px 2px 0 #07031f; max-width: 32em; margin: 0 auto 20px; }

/* Painel da pergunta: embaixo, sem tampar o foguete */
.caixa {
  position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(560px, calc(100% - 32px));
  max-height: 52%; overflow-y: auto;
  background: var(--caixa); padding: 16px 18px;
  box-shadow:
    0 -4px 0 0 var(--borda), 0 4px 0 0 var(--borda),
    -4px 0 0 0 var(--borda), 4px 0 0 0 var(--borda),
    8px 8px 0 0 #000;
}
h2 { font-family: var(--titulo); font-size: 14px; line-height: 1.7; margin: 0 0 12px; text-wrap: balance; }
form { display: flex; gap: 12px; }
input {
  flex: 1; min-width: 0; padding: 10px 12px; font: inherit;
  background: #07031f; color: var(--texto); border: 0; border-radius: 0;
  box-shadow: inset 0 0 0 3px #5b4bd6;
}
input:focus { outline: none; box-shadow: inset 0 0 0 3px var(--amarelo); }
button {
  font-family: var(--titulo); font-size: 12px; padding: 12px 14px;
  border: 0; border-radius: 0; background: var(--amarelo); color: #1a1000;
  box-shadow: inset -4px -4px 0 #c79400, 4px 4px 0 #000; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--rosa); outline-offset: 3px; }
button:active { transform: translate(2px, 2px); box-shadow: inset -4px -4px 0 #c79400, 2px 2px 0 #000; }
button:disabled { filter: grayscale(1); opacity: 0.5; cursor: default; }
#comecar { font-size: 16px; padding: 16px 22px; }
#mensagem { min-height: 1.2em; margin: 10px 0 0; }
.acerto { color: var(--verde); }
.profundo { color: var(--roxo); }
.erro { color: var(--vermelho); }
.supernova { color: var(--rosa); animation: piscar 0.4s steps(2) 6; }
@keyframes piscar { 50% { color: var(--amarelo); } }
/* lista das mais nichadas em "fichas", para ocupar pouca altura */
ol { list-style: none; padding: 0; margin: 6px 0 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
li { white-space: nowrap; }
li span, .suave { color: var(--suave); }
#revelacao p { margin: 10px 0 0; }
pre {
  font-family: var(--corpo); font-size: 24px; white-space: pre-wrap;
  background: #07031f; padding: 12px; box-shadow: inset 0 0 0 3px #5b4bd6;
}

@media (max-width: 480px) {
  body { font-size: 20px; }
  form { flex-direction: column; }
  #hud { font-size: 10px; }
  #distancia { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .supernova { animation: none; }
}
</style>
</head>
<body>
  <div id="tela">
    <canvas id="cena" aria-hidden="true"></canvas>

    <div id="hud" hidden>
      <div>
        <span class="rotulo">PROFUNDIDADE</span>
        <span id="distancia">0 AL</span>
      </div>
      <div class="direita">
        <span id="rodada"></span>
        <span id="combustivel"></span>
      </div>
    </div>

    <section id="inicio" class="sobreposto">
      <h1>NICHO</h1>
      <p>Responda cada pergunta com a palavra mais nichada que conseguir.<br>
         Quanto mais rara, mais fundo o foguete desce no espaço.</p>
      <button id="comecar" type="button">MERGULHAR</button>
      <p id="carregando" class="suave"></p>
    </section>

    <section id="painel" class="caixa" hidden>
      <h2 id="pergunta"></h2>
      <form id="formulario" autocomplete="off">
        <input id="palpite" type="text" placeholder="sua resposta…" aria-label="Sua resposta"
               autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <button type="submit">LANÇAR</button>
      </form>
      <p id="mensagem" role="status"></p>
      <div id="revelacao" hidden>
        <p class="suave">As mais nichadas (anos-luz, ★ = supernova):</p>
        <ol id="top"></ol>
        <button id="proxima" type="button">PRÓXIMA ▶</button>
      </div>
    </section>

    <section id="fim" class="caixa" hidden>
      <h2>FIM DA VIAGEM</h2>
      <p id="resumo"></p>
      <pre id="compartilhar"></pre>
      <button id="copiar" type="button">COPIAR RESULTADO</button>
      <p class="suave">Novas perguntas amanhã.</p>
    </section>
  </div>

function faixa(pontos, supernova) {
  if (supernova) return "supernova";
  return FAIXAS.find((f) => pontos >= f.min).nome;
}

function corDaFaixa(pontos, supernova) {
  if (supernova) return "#ff3dd6";

}

// Número pseudoaleatório fixo para cada par (a, b): o cenário é sempre o mesmo.
function sorte(a, b) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263);

  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function misturar(c1, c2, t) {
  return c1.map((v, i) => Math.round(v + (c2[i] - v) * t));
}

function corDoFundo(al) {
  if (al <= PARADAS_FUNDO[0][0]) return PARADAS_FUNDO[0][1];
  for (let i = 1; i < PARADAS_FUNDO.length; i++) {
    const [a0, c0] = PARADAS_FUNDO[i - 1];
    const [a1, c1] = PARADAS_FUNDO[i];
    if (al <= a1) return misturar(c0, c1, (al - a0) / (a1 - a0));
  }
  return PARADAS_FUNDO[PARADAS_FUNDO.length - 1][1];
}

// Quantas estrelas aparecem: nenhuma no céu da Terra, muitas no espaço
// próximo, e cada vez menos lá no fundo (sensação de distância).
function densidadeEstrelas(al) {
  if (al < 8) return 0;
  if (al < 40) return (al - 8) / 32;
  if (al < 300) return 1;
  return Math.max(0.2, 1 - (al - 300) / 1200);
}

const suave = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function desenharSprite(ctx, linhas, x, y) {
  for (let j = 0; j < linhas.length; j++) {
    for (let i = 0; i < linhas[j].length; i++) {
      const cor = CORES[linhas[j][i]];
      if (!cor) continue;
      ctx.fillStyle = cor;
      ctx.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
    }
  }
}

function desenharCorpo(ctx, cx, cy, corpo, semente) {
  const { r, cores } = corpo;
  cx = Math.round(cx);
  cy = Math.round(cy);
  const anel = (frente) => {
    if (!corpo.anel) return;
    ctx.fillStyle = corpo.anel;
    for (let a = 0; a < Math.PI * 2; a += 0.02) {
      const x = Math.round(cx + Math.cos(a) * r * 1.9);
      const y = Math.round(cy + Math.sin(a) * r * 0.45);
      if ((y >= cy) === frente) ctx.fillRect(x, y, 1, 1);
    }
  };
  anel(false);
  if (corpo.estrela) {
    ctx.fillStyle = "rgba(255, 210, 63, 0.18)";
    ctx.fillRect(cx - r * 2, cy - 1, r * 4, 3);
    ctx.fillRect(cx - 1, cy - r * 2, 3, r * 4);
  }
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      let cor = cores[0];
      if (corpo.faixas && (dy + r) % 4 === 1) cor = cores[1];
      if (corpo.crateras && sorte(dx + 50 + semente, dy + 50) > 0.88) cor = cores[1];
      if (dx + dy > r * 0.7) cor = cores[2]; // sombra
      ctx.fillStyle = cor;
      ctx.fillRect(cx + dx, cy + dy, 1, 1);
    }
  }
  anel(true);
}

function desenharAsteroide(ctx, x, y, tamanho, semente) {
  for (let dy = -tamanho; dy <= tamanho; dy++) {
    for (let dx = -tamanho; dx <= tamanho; dx++) {
      if (dx * dx + dy * dy > tamanho * tamanho + sorte(semente + dx, dy) * 3) continue;
      ctx.fillStyle = dx + dy > 0 ? "#5a4f48" : "#8a7a6a";
      ctx.fillRect(Math.round(x) + dx, Math.round(y) + dy, 1, 1);
    }
  }
}

// A Terra é grande demais para desenhar pixel a pixel a cada quadro:
// desenha uma vez numa tela separada e só copia.
function desenharTerra(largura, altura) {
  const tela = document.createElement("canvas");
  tela.width = largura;
  tela.height = altura;
  const ctx = tela.getContext("2d");
  const raio = Math.max(largura, altura) * 1.3;
  const cx = largura / 2;
  const cy = altura - 1 - raio;
  for (let y = 0; y < altura; y++) {
    const meia = Math.sqrt(Math.max(0, raio * raio - (y - cy) * (y - cy)));
    for (let x = Math.floor(cx - meia); x <= cx + meia; x++) {
      if (x < 0 || x >= largura) continue;
      const borda = raio - Math.hypot(x - cx, y - cy);
      let cor = "#2f6fe0";
      // continentes: manchas grandes com borda irregular
      const terra = sorte(Math.floor(x / 26), Math.floor(y / 14)) * 0.8 + sorte(Math.floor(x / 6), Math.floor(y / 4)) * 0.35;
      if (terra > 0.72) cor = "#3fbf5f";
      if (terra > 0.95) cor = "#2f9a4a";
      if (sorte(Math.floor(x / 9) + 999, Math.floor(y / 3)) > 0.965) cor = "#f4f4ff"; // nuvens
      if (borda < 3) cor = "#bfe9ff"; // atmosfera
      ctx.fillStyle = cor;
      ctx.fillRect(x, y, 1, 1);
    }
  }
  return tela;
}

function criarCena(canvas, tela) {
  const ctx = canvas.getContext("2d");
  const reduzirMovimento = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let L = 0; // largura da cena em pixels
  let A = 0; // altura
  let focoY = 0; // altura do foguete na tela
  let terra = null;

  const camera = { de: 0, para: 0, inicio: 0, atual: 0, velocidade: 0 };
  const caixas = []; // palavras flutuando
  let flash = 0;
  let quadro = 0;
  let anterior = performance.now();
  let aoQuadro = () => {};

  function ajustarTamanho() {
    const escala = Math.max(2, Math.round(Math.min(innerWidth, innerHeight) / 220));
    L = Math.ceil(innerWidth / escala);
    A = Math.ceil(innerHeight / escala);
    canvas.width = L;
    canvas.height = A;
    focoY = Math.round(A * 0.3);
    terra = desenharTerra(L, focoY);
    ctx.imageSmoothingEnabled = false;
  }
  ajustarTamanho();
  addEventListener("resize", ajustarTamanho);

  // profundidade (anos-luz) -> linha da tela
  const naTela = (al) => focoY + (al - camera.atual) * PX_POR_AL;

  function atualizarCamera(agora) {
    const t = Math.min(1, (agora - camera.inicio) / DURACAO_DESCIDA);
    const nova = camera.de + (camera.para - camera.de) * suave(t);
    const dt = Math.max(1, agora - anterior) / 1000;
    camera.velocidade = (nova - camera.atual) / dt; // anos-luz por segundo
    camera.atual = nova;
  }

  function desenharFundo() {
    for (let y = 0; y < A; y += 2) {
      const al = camera.atual + (y - focoY) / PX_POR_AL;
      const [r, g, b] = corDoFundo(Math.floor(al / 3) * 3); // faixas, estilo pixel
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(0, y, L, 2);
    }
  }

  function desenharEstrelas() {
    const camadas = [
      { f: 0.2, cor: "#4a3f9e", n: 5 },
      { f: 0.45, cor: "#8f86ff", n: 4 },
      { f: 1, cor: "#ffffff", n: 3 },
    ];
    const BLOCO = 40;
    camadas.forEach((c, ci) => {
      const desvio = camera.atual * PX_POR_AL * c.f;
      const primeiro = Math.floor((desvio - focoY) / BLOCO);
      const ultimo = Math.floor((desvio - focoY + A) / BLOCO);
      const rastro = reduzirMovimento ? 0 : Math.min(12, (camera.velocidade * PX_POR_AL * c.f) / 25);
      for (let k = primeiro; k <= ultimo; k++) {
        for (let i = 0; i < c.n; i++) {
          const yMundo = k * BLOCO + sorte(k, i * 7 + ci) * BLOCO;
          const al = yMundo / (PX_POR_AL * c.f);
          if (sorte(k, i * 7 + ci + 3) > densidadeEstrelas(al)) continue;
          const x = Math.floor(sorte(k, i * 7 + ci + 1) * L);
          const y = Math.floor(yMundo - desvio + focoY);
          const pisca = sorte(k + quadro >> 5, i) > 0.97 ? 0.3 : 1;
          ctx.globalAlpha = pisca;
          ctx.fillStyle = c.cor;
          ctx.fillRect(x, y, 1, 1 + Math.round(rastro));
        }
      }
    });
    ctx.globalAlpha = 1;
  }

  // Objetos soltos no caminho: satélites perto da Terra, asteroides, cometas.
  function desenharObjetos() {
    const BLOCO = 70;
    const desvio = camera.atual * PX_POR_AL;
    const primeiro = Math.max(1, Math.floor((desvio - focoY - 30) / BLOCO));
    const ultimo = Math.floor((desvio - focoY + A + 30) / BLOCO);
    for (let k = primeiro; k <= ultimo; k++) {
      if (sorte(k, 501) > 0.55) continue;
      const yMundo = k * BLOCO + sorte(k, 502) * BLOCO;
      const al = yMundo / PX_POR_AL;
      let x = sorte(k, 503) * L;
      if (Math.abs(x - L / 2) < 20) x += x < L / 2 ? -30 : 30; // longe do foguete
      const y = yMundo - desvio + focoY;
      if (al < 30) desenharSprite(ctx, SATELITE, x, y);
      else if (al < 900 && sorte(k, 504) > 0.25) desenharAsteroide(ctx, x, y, 1 + Math.floor(sorte(k, 505) * 3), k);
      else {
        // cometa: cabeça e cauda
        ctx.fillStyle = "#bfe9ff";
        ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
        ctx.fillStyle = "rgba(191, 233, 255, 0.4)";
        for (let t = 1; t < 10; t++) ctx.fillRect(Math.round(x) + t, Math.round(y) - t, 1, 1);
      }
    }
  }

  function desenharMarcos() {
    ctx.font = FONTE;
    ctx.textBaseline = "middle";
    for (const m of MARCOS) {
      const y = Math.round(naTela(m.al));
      if (y < -60 || y > A + 60) continue;
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
      for (let x = 0; x < L; x += 4) ctx.fillRect(x, y, 2, 1);
      if (m.corpo) desenharCorpo(ctx, L * 0.8, y, m.corpo, m.al);
      if (m.cinturao) {
        for (let i = 0; i < 28; i++) {
          desenharAsteroide(ctx, sorte(m.al, i) * L, y + (sorte(m.al, i + 50) - 0.5) * 24, Math.floor(sorte(m.al, i + 99) * 2), i);
        }
      }
      if (m.nebulosa) {
        for (let i = 0; i < 260; i++) {
          const a = sorte(i, 7) * Math.PI * 2;
          const d = Math.sqrt(sorte(i, 8)) * 40;
          ctx.fillStyle = i % 3 ? "rgba(255, 61, 214, 0.35)" : "rgba(58, 215, 255, 0.35)";
          ctx.fillRect(Math.round(L * 0.75 + Math.cos(a) * d * 1.4), Math.round(y + Math.sin(a) * d * 0.6), 2, 2);
        }
      }
      const rotulo = `${m.al} AL · ${m.nome}`;
      const largura = Math.ceil(ctx.measureText(rotulo).width) + 6;
      ctx.fillStyle = "rgba(7, 3, 31, 0.7)";
      ctx.fillRect(3, y - 6, largura, 11);
      ctx.fillStyle = "#ffd23f";
      ctx.fillText(rotulo, 6, y);
    }
  }

  function desenharTerraNaCena() {
    const fundoTerra = Math.round(naTela(0)) - 10; // a superfície fica logo acima do foguete no início
    if (fundoTerra < 0) return;
    ctx.drawImage(terra, 0, fundoTerra - terra.height);
    if (fundoTerra > terra.height) {
      ctx.fillStyle = "#2f6fe0";
      ctx.fillRect(0, 0, L, fundoTerra - terra.height);
    }
  }

  function desenharFoguete() {
    const descendo = camera.velocidade > 5;
    const balanco = reduzirMovimento || descendo ? 0 : Math.round(Math.sin(quadro / 25));
    const tremido = !reduzirMovimento && descendo ? Math.round((Math.random() - 0.5) * 2) : 0;
    const x = Math.round(L / 2 - 5) + tremido;
    const y = focoY - 6 + balanco;
    const nivel = camera.velocidade > 60 ? 2 : descendo ? 1 : 0;
    const chama = CHAMA[nivel];
    // a chama fica em cima, porque o foguete está de cabeça para baixo
    desenharSprite(ctx, [...chama].reverse().map((l) => (quadro >> 2) % 2 ? l : l.replaceAll("F", "f")), x, y - chama.length);
    desenharSprite(ctx, FOGUETE, x, y);
  }

  function desenharCaixas(agora) {
    ctx.font = FONTE;
    ctx.textBaseline = "middle";
    for (let i = caixas.length - 1; i >= 0; i--) {
      const c = caixas[i];
      const t = agora - c.inicio;
      // afunda junto com o foguete; depois sobe devagar em direção à superfície
      let al;
      if (t < DURACAO_DESCIDA) al = c.de + (c.para - c.de) * suave(t / DURACAO_DESCIDA);
      else al = c.para - ((t - DURACAO_DESCIDA) / 1000) * c.subida;
      const y = Math.round(naTela(al));
      if (y < -30) {
        caixas.splice(i, 1);
        continue;
      }
      const texto = `${c.texto} +${c.pontos}`;
      const w = Math.ceil(ctx.measureText(texto).width) + 8;
      let x = Math.round(c.lado < 0 ? L / 2 - 10 - w : L / 2 + 10);
      x = Math.max(2, Math.min(L - w - 2, x)); // não sai da tela em celular
      ctx.globalAlpha = Math.min(1, t / c.surgir);
      ctx.fillStyle = "rgba(7, 3, 31, 0.85)";
      ctx.fillRect(x, y - 7, w, 13);
      ctx.fillStyle = c.cor;
      ctx.fillRect(x, y - 7, w, 1);
      ctx.fillRect(x, y + 5, w, 1);
      ctx.fillRect(x, y - 7, 1, 13);
      ctx.fillRect(x + w - 1, y - 7, 1, 13);
      ctx.fillText(texto, x + 4, y);
    }
    ctx.globalAlpha = 1;
  }

  function passo(agora) {
    quadro++;
    atualizarCamera(agora);
    anterior = agora;
    desenharFundo();
    desenharEstrelas();
    desenharTerraNaCena();
    desenharObjetos();
    desenharMarcos();
    desenharFoguete();
    desenharCaixas(agora);
    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${flash})`;
      ctx.fillRect(0, 0, L, A);
      flash = Math.max(0, flash - 0.03);
    }
    aoQuadro(camera.atual);
    requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);

  function tremer(forca, duracao) {
    if (reduzirMovimento || !tela.animate) return;
    const passos = [];
    for (let i = 0; i < 12; i++) {
      const f = forca * (1 - i / 12);
      passos.push({ transform: `translate(${(Math.random() - 0.5) * 2 * f}px, ${(Math.random() - 0.5) * 2 * f}px)` });
    }
    passos.push({ transform: "translate(0, 0)" });
    tela.animate(passos, { duration: duracao, easing: "linear" });
  }

  return {
    // Desce o foguete pelos pontos da resposta e solta a palavra numa caixinha.
    descer(texto, pontos, supernova) {
      const agora = performance.now();
      const peso = Math.min(1, pontos / 100);
      camera.de = camera.atual;
      camera.para = camera.atual + pontos;
      camera.inicio = agora;
      caixas.push({
        texto: texto.toUpperCase(),
        pontos,
        cor: corDaFaixa(pontos, supernova),
        de: camera.de,
        para: camera.para + pontos * 0.25 * peso, // as densas afundam um pouco além do foguete
        inicio: agora,
        surgir: 80 + 1400 * (1 - peso), // as óbvias aparecem devagar
        subida: 6 - 4 * peso, // anos-luz por segundo subindo depois
        lado: caixas.length % 2 ? -1 : 1,
      });
      tremer(2 + 14 * peso + (supernova ? 10 : 0), 250 + 900 * peso);
      if (supernova) flash = 0.8;
    },
    // Coloca a câmera numa profundidade sem animação (ao retomar o dia).
    irPara(al) {
      camera.de = camera.para = camera.atual = al;
    },
    aoQuadro(fn) {
      aoQuadro = fn;
    },
  };
}
</script>
  <script>
// Nicho: protótipo do jogo diário.
// Cada rodada mostra uma pergunta-tema; o jogador dá UMA resposta válida.
// Quanto mais nichada a resposta, mais anos-luz ela vale.
// Acertar a "supernova" (a resposta secreta da pergunta) dobra os pontos.
// criarCena e faixa vêm de cena.js; as perguntas vêm de dados.js (window.NICHO_DADOS).

const RODADAS_POR_DIA = 7;
const TENTATIVAS = 3;
const ICONES = { satelite: "🛰️", lua: "🌙", planeta: "🪐", supernova: "🌟", nada: "⚫" };

// Mesma regra de scripts/pontuar.py: minúsculas, sem acento, hífen vira espaço.
function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

// Tira artigos do começo ("o Acre", "a Lua") e espaços, para comparar.
function compactar(texto) {
  return normalizar(texto).replace(/^(o|a|os|as|um|uma) /, "").replaceAll(" ", "");
}

// Distância de edição (com troca de letras vizinhas): quantas letras faltam,
// sobram, estão erradas ou trocadas de lugar.
function distancia(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const custo = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + custo);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[a.length][b.length];
}

// Autocorreção generosa: compara com todas as respostas e apelidos.
// Palavras curtas precisam vir quase certas; longas aceitam mais erros.
function tolerancia(tamanho) {
  if (tamanho <= 3) return 0;
  if (tamanho <= 5) return 1;
  if (tamanho <= 9) return 2;
  return 3;
}

function buscar(cat, texto) {
  const alvo = compactar(texto);
  if (!alvo) return null;
  if (cat.mapa.has(alvo)) return { resposta: cat.mapa.get(alvo), corrigido: false };
  const limite = tolerancia(alvo.length);
  let melhor = null;
  let menor = Infinity;
  for (const [nome, resposta] of cat.mapa) {
    if (Math.abs(nome.length - alvo.length) > limite) continue;
    const d = distancia(alvo, nome);
    if (d < menor) {
      menor = d;
      melhor = resposta;
    }
  }
  return menor <= limite ? { resposta: melhor, corrigido: true } : null;
}

// Sorteio determinístico pela data: todo mundo recebe as mesmas perguntas no dia.
function geradorDoDia(data) {
  let semente = Number(data.replaceAll("-", ""));
  return () => {
    semente = (semente * 1103515245 + 12345) % 2147483648;
    return semente / 2147483648;
  };
}

function embaralhar(lista, sortear) {
  const copia = [...lista];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(sortear() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function hojeLocal() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// Progresso do dia fica no navegador, para não perder ao recarregar.
// Se o armazenamento estiver bloqueado, o jogo funciona igual, só não lembra.
const CHAVE = () => `nicho:${estado.data}`;
function salvarProgresso() {
  try {
    localStorage.setItem(CHAVE(), JSON.stringify({ historico: estado.historico, total: estado.total }));
  } catch {}
}
function lerProgresso() {
  try {
    return JSON.parse(localStorage.getItem(CHAVE()) || "null");
  } catch {
    return null;
  }
}

const $ = (id) => document.getElementById(id);
const cena = criarCena($("cena"), $("tela"));
cena.aoQuadro((al) => ($("distancia").textContent = `${Math.round(al)} AL`));

const estado = {
  data: hojeLocal(),
  categorias: [],
  rodada: 0,
  tentativas: TENTATIVAS,
  total: 0,
  historico: [], // { categoria, resposta, pontos, supernova }
};

function iniciar() {
  const dados = window.NICHO_DADOS;
  if (!dados) {
    $("carregando").textContent = "Não achei as perguntas (jogo/dados.js). Rode python3 scripts/pontuar.py.";
    return;
  }
  const escolhidas = embaralhar(dados.indice, geradorDoDia(estado.data)).slice(0, RODADAS_POR_DIA);
  estado.categorias = escolhidas.map((c) => prepararCategoria(dados.categorias[c.id]));

  const salvo = lerProgresso();
  if (salvo) {
    estado.historico = salvo.historico;
    estado.total = salvo.total;
    estado.rodada = salvo.historico.length;
    cena.irPara(estado.total);
  }
  if (estado.rodada >= estado.categorias.length) {
    $("inicio").hidden = true;
    $("hud").hidden = false;
    mostrarFim();
    return;
  }
  if (estado.rodada > 0) $("comecar").textContent = "CONTINUAR";
  $("comecar").focus();
}

// Começa na superfície da Terra; o primeiro clique solta o foguete.
function comecar() {
  $("inicio").hidden = true;
  $("hud").hidden = false;
  $("painel").hidden = false;
  mostrarRodada();
}

function prepararCategoria(cat) {
  const mapa = new Map();
  for (const r of cat.respostas) {
    for (const nome of [r.resposta, ...r.apelidos]) mapa.set(compactar(nome), r);
  }
  return { ...cat, mapa };
}

function mostrarRodada() {
  const cat = estado.categorias[estado.rodada];
  estado.tentativas = TENTATIVAS;
  $("rodada").textContent = `PERGUNTA ${estado.rodada + 1}/${estado.categorias.length}`;
  $("pergunta").textContent = cat.pergunta || cat.titulo;
  avisar("", "");
  $("revelacao").hidden = true;
  $("palpite").value = "";
  $("palpite").disabled = false;
  $("formulario").querySelector("button").disabled = false;
  atualizarPainel();
  $("palpite").focus();
}

function atualizarPainel() {
  $("combustivel").textContent =
    "COMBUSTÍVEL " + "■".repeat(estado.tentativas) + "□".repeat(TENTATIVAS - estado.tentativas);
}

function palpitar(evento) {
  evento.preventDefault();
  const cat = estado.categorias[estado.rodada];
  const texto = $("palpite").value.trim();
  if (!texto) return;
  const busca = buscar(cat, texto);

  if (!busca) {
    estado.tentativas -= 1;
    atualizarPainel();
    $("palpite").value = "";
    if (estado.tentativas > 0) {
      avisar(`"${texto}" não está no mapa estelar. Tente de novo.`, "erro");
      return;
    }
    avisar("Acabou o combustível nesta pergunta. 0 anos-luz.", "erro");
    encerrarRodada(null, 0, false);
    return;
  }

  const achada = busca.resposta;
  const supernova = achada.resposta === cat.supernova;
  const pontos = supernova ? achada.pontos * 2 : achada.pontos;
  const correcao = busca.corrigido ? ` (você digitou "${texto}")` : "";
  if (supernova) {
    avisar(`SUPERNOVA! ${achada.resposta} vale ${pontos} anos-luz.${correcao}`, "supernova");
  } else {
    avisar(`${achada.resposta}: +${pontos} anos-luz.${correcao}`, pontos >= 50 ? "profundo" : "acerto");
  }
  cena.descer(achada.resposta, pontos, supernova);
  encerrarRodada(achada.resposta, pontos, supernova);
}

function encerrarRodada(resposta, pontos, supernova) {
  const cat = estado.categorias[estado.rodada];
  estado.total += pontos;
  estado.historico.push({ categoria: cat.titulo, resposta, pontos, supernova });
  salvarProgresso();
  atualizarPainel();
  $("palpite").disabled = true;
  $("formulario").querySelector("button").disabled = true;

  const top = [...cat.respostas].sort((a, b) => b.pontos - a.pontos).slice(0, 5);
  if (!top.some((r) => r.resposta === cat.supernova)) {
    top.push(cat.respostas.find((r) => r.resposta === cat.supernova));
  }
  $("top").innerHTML = "";
  for (const r of top) {
    const li = document.createElement("li");
    li.textContent = r.resposta + " ";
    const extra = document.createElement("span");
    extra.textContent = r.resposta === cat.supernova ? `${r.pontos} ★` : `${r.pontos}`;
    li.append(extra);
    $("top").append(li);
  }
  $("proxima").textContent = estado.rodada + 1 < estado.categorias.length ? "PRÓXIMA ▶" : "VER RESULTADO";
  $("revelacao").hidden = false;
  $("proxima").focus();
}

function avisar(texto, classe) {
  $("mensagem").textContent = texto;
  $("mensagem").className = classe;
}

function proxima() {
  estado.rodada += 1;
  if (estado.rodada < estado.categorias.length) {
    mostrarRodada();
    return;
  }
  mostrarFim();
}

function mostrarFim() {
  $("painel").hidden = true;
  $("fim").hidden = false;
  $("resumo").textContent = `Você viajou ${estado.total} anos-luz hoje.`;
  const icones = estado.historico.map((h) => (h.resposta === null ? ICONES.nada : ICONES[faixa(h.pontos, h.supernova)]));
  $("compartilhar").textContent = `NICHO ${estado.data}\n${icones.join("")}\n${estado.total} anos-luz 🚀`;
}

function copiar() {
  const texto = $("compartilhar").textContent;
  const selecionar = () => {
    // sem acesso à área de transferência: seleciona o texto para copiar à mão
    const faixaTexto = document.createRange();
    faixaTexto.selectNodeContents($("compartilhar"));
    getSelection().removeAllRanges();
    getSelection().addRange(faixaTexto);
    $("copiar").textContent = "SELECIONADO, É SÓ COPIAR";
  };
  try {
    navigator.clipboard.writeText(texto).then(() => ($("copiar").textContent = "COPIADO!"), selecionar);
  } catch {
    selecionar();
  }
}

$("comecar").addEventListener("click", comecar);
$("formulario").addEventListener("submit", palpitar);
$("proxima").addEventListener("click", proxima);
$("copiar").addEventListener("click", copiar);
iniciar();
</script>
